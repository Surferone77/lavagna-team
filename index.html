<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hybrid One" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>The Hybrid One</title>
    <style>
      html, body { margin: 0; background: #0b0b0b; color-scheme: dark; -webkit-text-size-adjust: 100%; }
      * { -webkit-tap-highlight-color: transparent; }
      .spin { animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      select { appearance: auto; }
      button { font-family: inherit; }
      button:active { transform: scale(0.98); }
      input:focus, textarea:focus, select:focus { border-color: #B8FF2C !important; box-shadow: 0 0 0 3px rgba(184,255,44,0.15); }
      .fade { animation: fade .35s ease both; }
      @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      ::-webkit-scrollbar { display: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
